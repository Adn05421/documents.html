<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)}, $$=function(s){return Array.prototype.slice.call(document.querySelectorAll(s))};
var STORE='docOrganizerAppCreator24_v2', state={items:[],folders:[],activity:[],shares:[],settings:{email:'',theme:'light'},page:'home'}, pendingFiles=[], searchTerm='', toastTimer;
try{var saved=JSON.parse(localStorage.getItem(STORE)||'null');if(saved)state=Object.assign(state,saved,{settings:Object.assign({email:'',theme:'light'},saved.settings||{})})}catch(e){}
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function save(){try{localStorage.setItem(STORE,JSON.stringify(state));return true}catch(e){toast('تعذر الحفظ: قد تكون مساحة التخزين ممتلئة. نزّل نسخة احتياطية.');return false}}
function toast(s){$('#toastHost').innerHTML='<div class="toast">'+esc(s)+'</div>';clearTimeout(toastTimer);toastTimer=setTimeout(function(){$('#toastHost').innerHTML=''},3000)}
function log(action,name){state.activity.unshift({id:id(),action:action,item:name||'',date:new Date().toISOString()});state.activity=state.activity.slice(0,500)}
function allItems(){return state.items.filter(function(x){return !x.deleted})}
function folderName(fid){var f=state.folders.find(function(x){return x.id===fid});return f?f.name:'بدون مجلد'}
function fmtDate(d){return d?new Date(d+'T00:00:00').toLocaleDateString('ar-SA'):'—'}
function bytes(n){if(!n)return '0 بايت';var u=['بايت','KB','MB','GB'],i=Math.min(Math.floor(Math.log(n)/Math.log(1024)),3);return (n/Math.pow(1024,i)).toFixed(i?1:0)+' '+u[i]}
function fileIcon(x){if((x.type||'').indexOf('image/')===0)return '🖼️';if(/pdf/i.test(x.type||'')||/\.pdf$/i.test(x.name))return '📕';return '📄'}
function expiryBadge(x){if(!x.expiry)return '';var today=new Date();today.setHours(0,0,0,0);var d=Math.ceil((new Date(x.expiry+'T00:00:00')-today)/86400000);return d<0?'<span class="badge expired">منتهي منذ '+Math.abs(d)+' يوم</span>':d<=30?'<span class="badge warn">باقي '+d+' يوم</span>':'<span class="badge">ساري</span>'}
function actions(x,trash){if(trash)return '<div class="actions"><button class="action restore" title="استرجاع" data-act="restore" data-id="'+x.id+'">↩️</button><button class="action delete" title="حذف نهائي" data-act="purge" data-id="'+x.id+'">❌</button><button class="action" title="معاينة" data-act="preview" data-id="'+x.id+'">👁️</button><button class="action" title="تعديل" data-act="edit" data-id="'+x.id+'">✏️</button></div>';
return '<div class="actions"><button class="action" title="معاينة" data-act="preview" data-id="'+x.id+'">👁️</button><button class="action" title="تعديل" data-act="edit" data-id="'+x.id+'">✏️</button><button class="action" title="المفضلة" data-act="favorite" data-id="'+x.id+'">'+(x.favorite?'⭐':'☆')+'</button><button class="action" title="الوصول السريع" data-act="quick" data-id="'+x.id+'">⚡</button><button class="action" title="مشاركة واتساب" data-act="share" data-id="'+x.id+'">📤</button><button class="action delete" title="حذف" data-act="delete" data-id="'+x.id+'">🗑️</button></div>'}
function row(x,trash){return '<div class="itemrow"><div class="fileicon">'+fileIcon(x)+'</div><div class="iteminfo"><b>'+esc(x.name)+'</b><small>'+esc(folderName(x.folderId))+' · '+esc(x.tags||'بدون وسوم')+' · '+bytes(x.size||0)+'</small>'+(x.expiry?'<small>الانتهاء: '+fmtDate(x.expiry)+' '+expiryBadge(x)+'</small>':'')+'</div>'+actions(x,trash)+'</div>'}
function list(items,trash){return items.length?'<div class="list">'+items.map(function(x){return row(x,!!trash)}).join('')+'</div>':'<div class="empty"><div>📂</div>ما فيه عناصر هنا حاليًا</div>'}
function stat(icon,label,n){return '<div class="stat"><div class="stat-icon">'+icon+'</div><div><small>'+label+'</small><strong>'+n+'</strong></div></div>'}
function heading(title,sub,button){return '<div class="heading"><div><h1>'+title+'</h1><p>'+sub+'</p></div>'+(button||'')+'</div>'}
function addButton(){return '<button class="btn" id="addPage">＋ إضافة ملف</button>'}
function matches(x,q){q=q.toLowerCase();return [x.name,x.tags,x.notes,folderName(x.folderId)].some(function(v){return String(v||'').toLowerCase().indexOf(q)>=0})}
function render(){
 document.body.classList.toggle('dark',state.settings.theme==='dark');$('#themeBtn').textContent=state.settings.theme==='dark'?'☀️':'🌙';
 $$('#nav button').forEach(function(b){b.classList.toggle('active',b.dataset.page===state.page)});
 var all=allItems(),q=searchTerm.trim(),filtered=q?all.filter(function(x){return matches(x,q)}):all,renew=all.filter(function(x){return x.expiry}),fav=all.filter(function(x){return x.favorite}),trash=state.items.filter(function(x){return x.deleted}),quick=all.filter(function(x){return x.quick}),out='';
 if(state.page==='home'){
 var soon=renew.filter(function(x){return new Date(x.expiry+'T00:00:00')<=new Date(Date.now()+30*86400000)});
 out=heading('الرئيسية','نظرة سريعة على مستنداتك وملفاتك',addButton())+'<div class="stats">'+stat('📁','إجمالي المستندات',all.length)+stat('🗓️','تحتاج متابعة التجديد',soon.length)+stat('⭐','المفضلة',fav.length)+stat('🗑️','سلة المحذوفات',trash.length)+'</div><div class="panel"><div class="panelhead"><h2>إجراءات سريعة</h2></div><div class="quick"><button id="quickAdd"><span>🖼️</span><b>إضافة صورة أو ملف</b></button><button id="quickScan"><span>📷</span><b>تصوير / مسح مستند</b></button><button id="quickSearch"><span>🔎</span><b>بحث شامل</b></button><button data-goto="favorites"><span>⭐</span><b>المفضلة</b></button></div></div><div class="grid2"><div class="panel"><div class="panelhead"><h2>أحدث الملفات</h2><button class="btn secondary small" data-goto="files">عرض الكل</button></div>'+list(all.slice().sort(function(a,b){return b.created-a.created}).slice(0,5))+'</div><div class="panel"><div class="panelhead"><h2>التجديدات القادمة</h2><button class="btn secondary small" data-goto="renewals">عرض الكل</button></div>'+list(renew.slice().sort(function(a,b){return a.expiry.localeCompare(b.expiry)}).slice(0,5))+'</div></div>';
 }else if(state.page==='files'){
 var folders='<div class="foldergrid">'+state.folders.map(function(f){return '<div class="foldercard"><div class="foldername">📁 '+esc(f.name)+'</div><small>'+all.filter(function(x){return x.folderId===f.id}).length+' ملف</small><div class="actions"><button class="btn secondary small" data-folder="'+f.id+'">فتح</button><button class="action" title="تعديل المجلد" data-act="editFolder" data-id="'+f.id+'">✏️</button><button class="action delete" title="حذف المجلد" data-act="deleteFolder" data-id="'+f.id+'">🗑️</button></div></div>'}).join('')+'</div>';
 out=heading('الملفات والمجلدات','نظّم مستنداتك بمجلدات ووسوم',addButton())+'<div class="panel"><div class="panelhead"><h2>المجلدات</h2><button class="btn secondary small" id="newFolder">＋ مجلد جديد</button></div>'+(state.folders.length?folders:'<div class="empty">أنشئ مجلدًا لترتيب مستنداتك.</div>')+'</div><div class="panel"><div class="panelhead"><h2>'+(q?'نتائج البحث':'كل الملفات')+' ('+filtered.length+')</h2></div>'+list(filtered)+'</div>';
 }else if(state.page==='renewals')out=heading('التجديدات','تابع تواريخ انتهاء الهوية والرخصة والاستمارة وغيرها',addButton())+'<div class="notice">أضف تاريخ الانتهاء عند إضافة المستند أو تعديله. التذكيرات تعرض داخل التطبيق؛ التنبيهات التلقائية تتطلب إعدادًا إضافيًا.</div><div class="panel"><div class="panelhead"><h2>المستندات ذات تاريخ الانتهاء</h2></div>'+list(filtered.filter(function(x){return x.expiry}).sort(function(a,b){return a.expiry.localeCompare(b.expiry)}))+'</div>';
 else if(state.page==='favorites')out=heading('المفضلة','المستندات التي أضفتها للمفضلة',addButton())+'<div class="panel">'+list(filtered.filter(function(x){return x.favorite}))+'</div>';
 else if(state.page==='quick')out=heading('الوصول السريع','الملفات المثبتة للوصول السريع',addButton())+'<div class="panel">'+list(filtered.filter(function(x){return x.quick}))+'</div>';

 else if(state.page==='shares')out=heading('المشاركات','إدارة سجلات مشاركة الملفات','<button class="btn secondary" id="exportShares">تصدير السجل</button>')+'<div class="notice">تُفتح واتساب برسالة جاهزة. بحسب المتصفح وAppCreator24 قد يلزم إرفاق الملف يدويًا داخل واتساب.</div><div class="panel">'+(state.shares.length?'<div class="list">'+state.shares.map(function(s){var x=state.items.find(function(i){return i.id===s.itemId});return '<div class="itemrow"><div class="fileicon">📤</div><div class="iteminfo"><b>'+esc(s.name)+'</b><small>'+new Date(s.date).toLocaleString('ar-SA')+'</small></div><div class="actions">'+(x?'<button class="action" data-act="preview" data-id="'+x.id+'">👁️</button><button class="action" data-act="edit" data-id="'+x.id+'">✏️</button><button class="action" data-act="share" data-id="'+x.id+'">📤</button>':'')+'<button class="action delete" data-act="deleteShare" data-id="'+s.id+'">🗑️</button></div></div>'}).join('')+'</div>':'<div class="empty">ما تمت مشاركة ملفات حتى الآن.</div>')+'</div>';

function closeModal(){$('#modalHost').innerHTML=''}
function modal(title,body,buttons){$('#modalHost').innerHTML='<div class="modalback" id="modalback"><div class="modal"><div class="modalhead"><h2>'+title+'</h2><button class="iconbtn" id="closeModal">✕</button></div>'+body+(buttons?'<div class="modalfoot">'+buttons+'</div>':'')+'</div></div>';$('#closeModal').onclick=closeModal;$('#modalback').addEventListener('click',function(e){if(e.target.id==='modalback')closeModal()})}
function readFile(f){return new Promise(function(resolve,reject){var r=new FileReader();r.onload=function(){resolve(r.result)};r.onerror=reject;r.readAsDataURL(f)})}
function addFiles(files){pendingFiles=files.slice();showFileForm(null)}
function showFileForm(itemId){
 var x=itemId?state.items.find(function(i){return i.id===itemId}):null;
 var body='<form id="fileForm"><div class="formgrid"><div class="field full"><label>اسم المستند *</label><input name="name" required value="'+esc(x?x.name:(pendingFiles[0]?pendingFiles[0].name:''))+'" placeholder="مثال: الهوية الوطنية"></div><div class="field"><label>المجلد</label><select name="folderId"><option value="">بدون مجلد</option>'+state.folders.map(function(f){return '<option value="'+f.id+'" '+(x&&x.folderId===f.id?'selected':'')+'>'+esc(f.name)+'</option>'}).join('')+'</select></div><div class="field"><label>الوسوم (بفواصل)</label><input name="tags" value="'+esc(x?x.tags:'')+'" placeholder="هوية، مهم، شخصي"></div><div class="field"><label>تاريخ الانتهاء / التجديد</label><input name="expiry" type="date" value="'+esc(x?x.expiry:'')+'"></div><div class="field"><label>نوع المستند</label><select name="category">'+['عام','هوية','رخصة','مركبة','عقد','شهادة','أخرى'].map(function(v){return '<option '+(x&&x.category===v?'selected':'')+'>'+v+'</option>'}).join('')+'</select></div><div class="field full"><label>ملاحظات</label><textarea name="notes" placeholder="تفاصيل إضافية">'+esc(x?x.notes:'')+'</textarea></div>'+(x?'':'<div class="field full"><label>اختيار ملفات من الجهاز</label><input type="file" name="upload" multiple accept="image/*,application/pdf,.doc,.docx,.txt,.rtf,.odt,.xls,.xlsx,.ppt,.pptx"><small class="muted">يمكنك اختيار صور ومستندات. تخزين الملفات الكبيرة قد يتجاوز سعة المتصفح.</small></div>')+'</div></form>';
 modal(x?'تعديل المستند':'إضافة مستند',body,'<button class="btn" id="saveFile">حفظ المستند</button><button class="btn secondary" id="cancelFile">إلغاء</button>');
 $('#cancelFile').onclick=closeModal;
 $('#saveFile').onclick=async function(){
  var form=$('#fileForm');if(!form.reportValidity())return;var fd=new FormData(form),base={name:String(fd.get('name')).trim(),folderId:fd.get('folderId')||'',tags:String(fd.get('tags')).trim(),expiry:fd.get('expiry')||'',category:fd.get('category'),notes:String(fd.get('notes')).trim()};
  if(x){Object.assign(x,base);log('تعديل مستند',x.name);save();closeModal();render();toast('تم تعديل المستند');return}
  var chosen=Array.from(form.querySelector('input[name="upload"]').files||[]),files=pendingFiles.concat(chosen);
  if(!files.length){state.items.unshift(Object.assign({id:id(),type:'',size:0,data:'',created:Date.now(),favorite:false,quick:false,deleted:false},base));log('إضافة سجل مستند',base.name);save();pendingFiles=[];closeModal();render();toast('تمت إضافة المستند');return}
  closeModal();var count=0;
  for(var i=0;i<files.length;i++){var f=files[i];try{var data=await readFile(f);state.items.unshift(Object.assign({id:id(),name:files.length>1?f.name:base.name,type:f.type||'',size:f.size||0,data:data,created:Date.now(),favorite:false,quick:false,deleted:false},base));if(files.length>1)state.items[0].name=f.name;count++}catch(err){}}
  log('إضافة ملفات',count+' ملف');save();pendingFiles=[];render();toast('تمت إضافة '+count+' ملف');
 };
}
function preview(x){var body='<div class="notice">'+esc(x.name)+' · '+bytes(x.size||0)+'</div>';if(x.data&&(x.type||'').indexOf('image/')===0)body+='<img class="previewimg" src="'+x.data+'" alt="'+esc(x.name)+'">';else if(x.data&&(/pdf/i.test(x.type||'')||/\.pdf$/i.test(x.name)))body+='<iframe class="previewframe" src="'+x.data+'" title="معاينة الملف"></iframe>';else if(x.data)body+='<div class="empty"><div>📄</div>المعاينة المباشرة لهذا النوع قد لا تدعمها حاوية التطبيق.<br><a class="btn" download="'+esc(x.name)+'" href="'+x.data+'">تنزيل الملف</a></div>';else body+='<div class="empty">هذا سجل بدون ملف مرفق. عدّله لإضافة معلومات المستند.</div>';modal('معاينة المستند',body,'<button class="btn secondary" id="previewEdit">✏️ تعديل</button><button class="btn secondary" id="previewShare">📤 مشاركة واتساب</button>');$('#previewEdit').onclick=function(){showFileForm(x.id)};$('#previewShare').onclick=function(){share(x)}}
function share(x){state.shares.unshift({id:id(),itemId:x.id,name:x.name,date:new Date().toISOString()});log('تجهيز مشاركة واتساب',x.name);save();closeModal();render();var msg='مشاركة مستند: '+x.name+(x.expiry?'\nتاريخ الانتهاء: '+x.expiry:'')+(x.tags?'\nالوسوم: '+x.tags:'');var url='https://wa.me/?text='+encodeURIComponent(msg);var win=window.open(url,'_blank');if(!win)window.location.href=url;toast('جهزنا الرسالة. أرفق الملف يدويًا داخل واتساب إذا لزم.')}
function doAction(act,itemId){
 var x=state.items.find(function(i){return i.id===itemId});
 if(act==='edit'&&x){showFileForm(itemId);return}if(act==='preview'&&x){preview(x);return}if(act==='share'&&x){share(x);return}
 if(act==='favorite'&&x){x.favorite=!x.favorite;log(x.favorite?'إضافة للمفضلة':'إزالة من المفضلة',x.name)}
 if(act==='quick'&&x){x.quick=!x.quick;log(x.quick?'تثبيت في الوصول السريع':'إزالة من الوصول السريع',x.name)}
 if(act==='delete'&&x){x.deleted=true;log('نقل إلى سلة المحذوفات',x.name);toast('نُقل المستند إلى سلة المحذوفات')}
 if(act==='restore'&&x){x.deleted=false;log('استرجاع مستند',x.name);toast('تم استرجاع المستند')}
 if(act==='purge'&&x&&confirm('حذف المستند نهائيًا؟ لا يمكن التراجع.')){state.items=state.items.filter(function(i){return i.id!==itemId});log('حذف نهائي',x.name)}
 if(act==='deleteActivity'){state.activity=state.activity.filter(function(a){return a.id!==itemId})}
 if(act==='deleteShare'){state.shares=state.shares.filter(function(a){return a.id!==itemId});log('حذف سجل مشاركة',itemId)}
 if(act==='editFolder'){var folder=state.folders.find(function(f){return f.id===itemId});if(folder){var name=prompt('اسم المجلد الجديد',folder.name);if(name&&name.trim()){folder.name=name.trim();log('تعديل مجلد',folder.name)}}}
 if(act==='deleteFolder'){var f=state.folders.find(function(z){return z.id===itemId});if(f&&confirm('حذف المجلد "'+f.name+'"؟ ستبقى ملفاته بدون مجلد.')){state.items.forEach(function(i){if(i.folderId===itemId)i.folderId=''});state.folders=state.folders.filter(function(z){return z.id!==itemId});log('حذف مجلد',f.name)}}
 save();render();
}
function downloadJSON(data,name){var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url)},1000)}
$('#nav').addEventListener('click',function(e){var b=e.target.closest('button[data-page]');if(b){state.page=b.dataset.page;$('#sidebar').classList.remove('open');render()}});
$('#view').addEventListener('click',function(e){
 var goto=e.target.closest('[data-goto]');if(goto){state.page=goto.dataset.goto;render();return}
 var act=e.target.closest('[data-act]');if(act){e.stopPropagation();doAction(act.dataset.act,act.dataset.id);return}
 var folder=e.target.closest('[data-folder]');if(folder){var fid=folder.dataset.folder;var f=state.folders.find(function(z){return z.id===fid});modal('مجلد: '+esc(f?f.name:''),list(allItems().filter(function(x){return x.folderId===fid})), '<button class="btn secondary" id="folderClose">إغلاق</button>');$('#folderClose').onclick=closeModal;return}
 var idv=e.target.id;
 if(idv==='addPage'||idv==='addTop'||idv==='quickAdd'){$('#filePicker').click()}
 if(idv==='quickScan'){var inp=$('#filePicker');inp.setAttribute('accept','image/*');inp.setAttribute('capture','environment');inp.click()}
 if(idv==='quickSearch')$('#globalSearch').focus();
 if(idv==='newFolder'){var name=prompt('اكتب اسم المجلد');if(name&&name.trim()){state.folders.push({id:id(),name:name.trim()});log('إنشاء مجلد',name.trim());save();render()}}
 if(idv==='emptyTrash'&&confirm('حذف جميع عناصر سلة المحذوفات نهائيًا؟')){var n=state.items.filter(function(x){return x.deleted}).length;state.items=state.items.filter(function(x){return !x.deleted});log('تفريغ سلة المحذوفات',n+' عنصر');save();render()}
 if(idv==='clearActivity'&&confirm('مسح سجل النشاط؟')){state.activity=[];save();render()}
 if(idv==='saveEmail'){state.settings.email=$('#backupEmail').value.trim();save();toast('تم حفظ البريد')}
 if(idv==='backupBtn'){downloadJSON(state,'document-organizer-backup-'+new Date().toISOString().slice(0,10)+'.json');toast('تم تجهيز النسخة الاحتياطية للتنزيل')}
 if(idv==='exportShares')downloadJSON(state.shares,'document-organizer-shares.json');
 if(idv==='testSave'){var ok=save();toast(ok?'نجح اختبار الحفظ المحلي':'تعذر الحفظ')}
 if(idv==='settingTheme'){state.settings.theme=state.settings.theme==='dark'?'light':'dark';save();render()}
 if(idv==='wipeAll'&&confirm('سيتم حذف جميع الملفات والمجلدات والسجل نهائيًا من التخزين الحالي. هل أنت متأكد؟')){state={items:[],folders:[],activity:[],shares:[],settings:{email:'',theme:'light'},page:'home'};save();render();toast('تم حذف البيانات المحلية')}
});

document.addEventListener('change',async function(e){if(e.target.id==='restorePicker'&&e.target.files[0]){try{var data=JSON.parse(await e.target.files[0].text());if(!data||!Array.isArray(data.items)||!Array.isArray(data.folders))throw Error('invalid');if(confirm('استبدال البيانات الحالية بالنسخة الاحتياطية؟')){state=Object.assign({items:[],folders:[],activity:[],shares:[],settings:{email:'',theme:'light'},page:'home'},data);state.settings=Object.assign({email:'',theme:'light'},data.settings||{});save();render();toast('تمت استعادة النسخة الاحتياطية')}}catch(err){toast('ملف النسخة الاحتياطية غير صالح')}e.target.value=''}});
